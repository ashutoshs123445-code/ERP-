<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJPS ERP • Teacher</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#142033}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#fff;padding:18px;border-radius:18px;box-shadow:0 8px 28px #102a4312}input,select,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border:1px solid #dbe2ec;border-radius:10px}button{background:#173b67;color:#fff;border:0;font-weight:700}.student{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0}.mini{width:auto;margin-left:6px;padding:8px 12px}.muted{color:#6b7788}</style></head><body><div class="wrap"><div class="top"><div><h1>Teacher Dashboard</h1><div id="who" class="muted"></div></div><button id="logout" style="width:auto;padding:10px 18px">Logout</button></div><div class="grid"><section class="card"><h2>Attendance</h2><input id="date" type="date"><div id="students"></div><button id="saveAttendance">Save attendance</button></section><section class="card"><h2>Create Assignment</h2><input id="title" placeholder="Assignment title"><textarea id="desc" placeholder="Description" style="width:100%;box-sizing:border-box;height:90px"></textarea><input id="due" type="date"><button id="createAssignment">Create</button><div id="assignments" class="muted" style="margin-top:12px"></div></section><section class="card"><h2>Marks</h2><input id="exam" placeholder="Exam name"><input id="subject" placeholder="Subject"><input id="max" type="number" min="1" placeholder="Maximum marks"><div id="marks"></div><button id="saveMarks">Save results</button></section></div></div><script type="module">
import {auth,db} from './firebase-config.js';import {signOut} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import {collection,query,where,getDocs,setDoc,doc,addDoc,orderBy} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const $=id=>document.getElementById(id),profile=JSON.parse(localStorage.getItem('djpsProfile')||'null');if(!profile||profile.role!=='teacher'){location.href='login.html';throw Error('Teacher login required');}$('who').textContent=`${profile.fullName} • ${profile.className}-${profile.section}`;$('date').value=new Date().toISOString().slice(0,10);
let students=[];async function loadStudents(){const s=await getDocs(query(collection(db,'profiles'),where('schoolCode','==',profile.schoolCode),where('role','==','student'),where('classId','==',profile.classId)));students=s.docs.map(d=>({id:d.id,...d.data()}));$('students').innerHTML=students.map(x=>`<div class="student"><span>${x.fullName} <small>(${x.rollNo||'-'})</small></span><label><input type="checkbox" data-id="${x.id}" style="width:auto"> Present</label></div>`).join('');$('marks').innerHTML=students.map(x=>`<div class="student"><span>${x.fullName}</span><input class="score" data-id="${x.id}" type="number" min="0" step="0.01" style="width:100px" placeholder="marks"></div>`).join('');}
$('saveAttendance').onclick=async()=>{try{const date=$('date').value;if(!date)throw Error('Select date.');const batch=students.map(x=>setDoc(doc(db,'attendance',`${x.id}_${date}`),{studentId:x.id,studentName:x.fullName,classId:profile.classId,schoolCode:profile.schoolCode,date,status:document.querySelector(`[data-id="${x.id}"]`).checked?'present':'absent',markedBy:auth.currentUser?.uid||profile.id,createdAt:Date.now()}));await Promise.all(batch);alert('Attendance saved.');}catch(e){alert(e.message)}};
$('createAssignment').onclick=async()=>{try{const title=$('title').value.trim(),due=$('due').value;if(!title)throw Error('Enter assignment title.');await addDoc(collection(db,'assignments'),{title,description:$('desc').value.trim(),dueDate:due,schoolCode:profile.schoolCode,classId:profile.classId,teacherId:profile.id,createdAt:Date.now()});alert('Assignment created.');loadAssignments();}catch(e){alert(e.message)}};
async function loadAssignments(){const q=await getDocs(query(collection(db,'assignments'),where('classId','==',profile.classId),where('schoolCode','==',profile.schoolCode)));$('assignments').innerHTML=q.docs.map(d=>`<div>${d.data().title} — due ${d.data().dueDate||'-'}</div>`).join('')||'No assignments.'} 
$('saveMarks').onclick=async()=>{try{const exam=$('exam').value.trim(),subject=$('subject').value.trim(),max=Number($('max').value);if(!exam||!subject||!max)throw Error('Enter exam, subject and maximum marks.');const writes=[...document.querySelectorAll('.score')].map(el=>{const marks=Number(el.value);if(el.value!==''&&(marks<0||marks>max))throw Error('Marks must be between 0 and maximum marks.');return setDoc(doc(db,'results',`${el.dataset.id}_${exam}_${subject}`),{studentId:el.dataset.id,schoolCode:profile.schoolCode,classId:profile.classId,exam,subject,maxMarks:max,marks:el.value===''?null:marks,teacherId:profile.id,createdAt:Date.now()});});await Promise.all(writes);alert('Results saved.');}catch(e){alert(e.message)}};$('logout').onclick=()=>{localStorage.removeItem('djpsProfile');signOut(auth).finally(()=>location.href='login.html')};loadStudents();loadAssignments();
</script></body></html>
