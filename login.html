<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJPS ERP • Login</title><style>body{font-family:system-ui;background:linear-gradient(135deg,#07152d,#123d6b);min-height:100vh;display:grid;place-items:center;margin:0;color:#fff}.card{width:min(420px,90%);padding:28px;border-radius:24px;background:#ffffff16;backdrop-filter:blur(18px);border:1px solid #ffffff2a;box-shadow:0 20px 60px #0005}h1{margin:0 0 8px}.muted{opacity:.75;margin-bottom:22px}input,select,button{width:100%;box-sizing:border-box;padding:13px 14px;margin:7px 0;border-radius:12px;border:1px solid #ffffff30;background:#ffffff12;color:#fff}select option{color:#111}button{background:#fff;color:#123d6b;font-weight:800;cursor:pointer}.msg{min-height:22px;margin-top:10px;color:#ffd6d6}.brand{font-size:13px;letter-spacing:2px;opacity:.7}</style></head><body><main class="card"><div class="brand">DIVYA JYOTI PUBLIC SCHOOL</div><h1>School ERP</h1><div class="muted">Secure Firebase login</div><input id="schoolCode" placeholder="School code" value="DJPS"><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option><option value="admin">Admin</option></select><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><div id="msg" class="msg"></div></main><script type="module">
import {auth,db} from './firebase-config.js';
import {signInWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const $=id=>document.getElementById(id); const msg=t=>$('msg').textContent=t;
$('loginBtn').onclick=async()=>{msg('Signing in…');try{const school=( $('schoolCode').value||'DJPS').trim().toUpperCase();const role=$('role').value;const email=$('email').value.trim();const pass=$('password').value;if(!email||!pass)throw Error('Enter email and password.');const cred=await signInWithEmailAndPassword(auth,email,pass);const snap=await getDoc(doc(db,'profiles',cred.user.uid));if(!snap.exists())throw Error('Profile not found. Ask the school admin to create your profile.');const p=snap.data();if(p.schoolCode!==school||p.role!==role){await auth.signOut();throw Error('School code or selected role does not match this account.');}localStorage.setItem('djpsProfile',JSON.stringify({id:cred.user.uid,...p}));location.href=role==='admin'?'dashboard-admin.html':role==='teacher'?'dashboard-teacher.html':'dashboard-student.html';}catch(e){msg(e.message||'Login failed.');}};
onAuthStateChanged(auth,()=>{});
</script></body></html>
