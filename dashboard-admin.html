<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJPS ERP • Admin</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#142033}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;padding:18px;border-radius:18px;box-shadow:0 8px 28px #102a4312}input,select,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border:1px solid #dbe2ec;border-radius:10px}button{background:#173b67;color:#fff;border:0;font-weight:700}.stat{font-size:30px;font-weight:800}.muted{color:#6b7788}.list{max-height:240px;overflow:auto}.item{padding:9px 0;border-bottom:1px solid #eee}.danger{background:#9b2430}</style></head><body><div class="wrap"><div class="top"><div><h1>Admin Dashboard</h1><div id="who" class="muted"></div></div><button id="logout" style="width:auto;padding:10px 18px">Logout</button></div><div class="grid"><div class="card"><div class="muted">Students</div><div id="studentCount" class="stat">0</div></div><div class="card"><div class="muted">Teachers</div><div id="teacherCount" class="stat">0</div></div><div class="card"><div class="muted">Classes</div><div id="classCount" class="stat">0</div></div></div><div class="grid" style="margin-top:16px"><section class="card"><h2>Add Class</h2><input id="className" placeholder="Class e.g. 10"><input id="section" placeholder="Section e.g. A"><button id="addClass">Add class</button></section><section class="card"><h2>Add Student</h2><p class="muted">Creates Firebase Auth user + Firestore profile.</p><input id="sName" placeholder="Full name"><input id="sRoll" placeholder="Roll no"><select id="sClass"></select><input id="sEmail" type="email" placeholder="Student email"><input id="sPass" type="password" placeholder="Temporary password (6+ chars)"><button id="addStudent">Create student</button></section><section class="card"><h2>Add Teacher</h2><input id="tName" placeholder="Full name"><select id="tClass"></select><input id="tEmail" type="email" placeholder="Teacher email"><input id="tPass" type="password" placeholder="Temporary password (6+ chars)"><button id="addTeacher">Create teacher</button></section><section class="card"><h2>Students</h2><div id="students" class="list"></div></section></div></div><script type="module">
import {app,auth,db} from './firebase-config.js';import {signOut,createUserWithEmailAndPassword,getAuth} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import {getDocs,collection,query,where,addDoc,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import {firebaseConfig} from './firebase-config.js';
const $=id=>document.getElementById(id), profile=JSON.parse(localStorage.getItem('djpsProfile')||'null'); if(!profile||profile.role!=='admin'){location.href='login.html';throw Error('Admin login required');}$('who').textContent=`${profile.fullName||profile.email} • ${profile.schoolCode}`;
const secondary=getAuth(initializeApp(firebaseConfig,'adminCreator'));const cls=collection(db,'classes');
async function load(){const [cs,ss,ts]=await Promise.all([getDocs(query(cls,where('schoolCode','==',profile.schoolCode))),getDocs(query(collection(db,'profiles'),where('schoolCode','==',profile.schoolCode),where('role','==','student'))),getDocs(query(collection(db,'profiles'),where('schoolCode','==',profile.schoolCode),where('role','==','teacher')))]);$('classCount').textContent=cs.size;$('studentCount').textContent=ss.size;$('teacherCount').textContent=ts.size;$('sClass').innerHTML='';$('tClass').innerHTML='';cs.forEach(d=>{const x=d.data();const o=document.createElement('option');o.value=d.id;o.textContent=`${x.className}-${x.section}`;$('sClass').append(o);$('tClass').append(o.cloneNode(true));});$('students').innerHTML='';ss.forEach(d=>{const x=d.data();$('students').insertAdjacentHTML('beforeend',`<div class="item"><b>${x.fullName}</b> — Roll ${x.rollNo||'-'} — ${x.className||''} ${x.section||''}</div>`);});}
$('addClass').onclick=async()=>{try{const className=$('className').value.trim(),section=$('section').value.trim();if(!className||!section)throw Error('Enter class and section.');await addDoc(cls,{schoolCode:profile.schoolCode,className,section,createdAt:Date.now()});$('className').value='';$('section').value='';await load();}catch(e){alert(e.message)}};
async function createUser(kind){const name=$(kind==='student'?'sName':'tName').value.trim(),email=$(kind==='student'?'sEmail':'tEmail').value.trim(),pass=$(kind==='student'?'sPass':'tPass').value, classId=$(kind==='student'?'sClass':'tClass').value;if(!name||!email||pass.length<6||!classId)throw Error('Fill all fields; password must be 6+ chars.');const c=await createUserWithEmailAndPassword(secondary,email,pass);const cd=await getDoc(doc(db,'classes',classId));if(!cd.exists())throw Error('Class not found.');const x=cd.data();await setDoc(doc(db,'profiles',c.user.uid),{fullName:name,email,role:kind,schoolCode:profile.schoolCode,classId,className:x.className,section:x.section,rollNo:kind==='student'?$('sRoll').value.trim():'',createdAt:Date.now()});await signOut(secondary);alert(`${kind} created successfully.`);}
$('addStudent').onclick=async()=>{try{await createUser('student');await load();}catch(e){alert(e.message)}};$('addTeacher').onclick=async()=>{try{await createUser('teacher');await load();}catch(e){alert(e.message)}};$('logout').onclick=()=>{localStorage.removeItem('djpsProfile');signOut(auth).finally(()=>location.href='login.html')};load().catch(e=>alert(e.message));
</script></body></html>
