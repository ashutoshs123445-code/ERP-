<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJPS ERP • Student</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#142033}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#fff;padding:18px;border-radius:18px;box-shadow:0 8px 28px #102a4312}.item{padding:12px 0;border-bottom:1px solid #eee}.muted{color:#6b7788}button{padding:10px 16px;border:0;border-radius:10px;background:#173b67;color:#fff;font-weight:700}</style></head><body><div class="wrap"><div class="top"><div><h1>Student Dashboard</h1><div id="who" class="muted"></div></div><button id="logout">Logout</button></div><div class="grid" style="margin-top:16px"><section class="card"><h2>Attendance</h2><div id="attendance">Loading…</div></section><section class="card"><h2>Assignments</h2><div id="assignments">Loading…</div></section><section class="card"><h2>Results</h2><div id="results">Loading…</div></section></div></div><script type="module">
import {auth,db} from './firebase-config.js';import {signOut} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import {collection,query,where,getDocs} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const $=id=>document.getElementById(id),profile=JSON.parse(localStorage.getItem('djpsProfile')||'null');if(!profile||profile.role!=='student'){location.href='login.html';throw Error('Student login required');}$('who').textContent=`${profile.fullName} • Roll ${profile.rollNo||'-'} • ${profile.className}-${profile.section}`;
async function load(){const [a,r,s]=await Promise.all([getDocs(query(collection(db,'attendance'),where('studentId','==',profile.id),where('schoolCode','==',profile.schoolCode))),getDocs(query(collection(db,'results'),where('studentId','==',profile.id),where('schoolCode','==',profile.schoolCode))),getDocs(query(collection(db,'assignments'),where('classId','==',profile.classId),where('schoolCode','==',profile.schoolCode)))]);const total=a.size,present=a.docs.filter(d=>d.data().status==='present').length;$('attendance').innerHTML=`<b>${present}/${total}</b> present${total?` (${Math.round(present/total*100)}%)`:''}`;$('assignments').innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="item"><b>${x.title}</b><br><span class="muted">Due: ${x.dueDate||'-'}</span></div>`}).join('')||'No assignments.';$('results').innerHTML=r.docs.map(d=>{const x=d.data();return `<div class="item"><b>${x.subject}</b> — ${x.exam}<br>${x.marks===null?'Not graded':`${x.marks}/${x.maxMarks}`}</div>`}).join('')||'No results yet.';}
$('logout').onclick=()=>{localStorage.removeItem('djpsProfile');signOut(auth).finally(()=>location.href='login.html')};load().catch(e=>{console.error(e);alert(e.message)});
</script></body></html>
